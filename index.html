<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thành Phát Express</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #appFrame { display: block; width: 100%; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="appFrame" title="Thành Phát Express"></iframe>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbws956nwS4iKuKp5N46E_UgaTyaoNbz72indTlfEiB6gV4m5LPC4f7P09K3l2xtIF2teQ/exec';
    const frame = document.getElementById('appFrame');
    const allowedPages = new Set(['home', 'login', 'main', 'about', 'services', 'network', 'news']);

    function readRouteFromAddress() {
      const params = new URLSearchParams(window.location.search);
      const requestedPage = params.get('page') || 'home';
      const page = allowedPages.has(requestedPage) ? requestedPage : 'home';
      const session = params.get('session') || '';
      return { page: page, session: session };
    }

    function buildAppsScriptUrl(page, session) {
      const params = new URLSearchParams();
      if (page && page !== 'home') params.set('page', page);
      if (page === 'main' && session) params.set('session', session);
      const query = params.toString();
      return SCRIPT_URL + (query ? '?' + query : '');
    }

    function renderRouteFromAddress() {
      const route = readRouteFromAddress();

      if (route.session) {
        sessionStorage.setItem('tp_session_token', route.session);
      }

      frame.src = buildAppsScriptUrl(route.page, route.session);
      console.log('GitHub route:', route.page, 'iframe:', frame.src);
    }

    window.addEventListener('popstate', renderRouteFromAddress);
    renderRouteFromAddress();
  </script>
</body>
</html>
