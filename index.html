<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thành Phát Express</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #appFrame { display: block; width: 100%; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="appFrame" title="Thành Phát Express" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwN6v5tf8fys2gSOLMMiAEWaF_IgOv2512KoCD7lWlBbbfNovV6dscsZu50Mawq1Q9dcg/exec';
    const frame = document.getElementById('appFrame');
    const ALLOWED = ['home', 'login', 'main', 'about', 'services', 'network', 'news'];

    function readRoute() {
      const params = new URLSearchParams(window.location.search);
      return {
        page: ALLOWED.includes(params.get('page')) ? params.get('page') : 'home',
        session: params.get('session') || sessionStorage.getItem('tp_session_token') || ''
      };
    }

    function setBrowserRoute(page, session, replace) {
      const params = new URLSearchParams();
      if (page && page !== 'home') params.set('page', page);
      if (session) params.set('session', session);
      const query = params.toString();
      const url = window.location.pathname + (query ? '?' + query : '');
      const state = { page: page || 'home', session: session || '' };
      if (replace) history.replaceState(state, '', url);
      else history.pushState(state, '', url);
    }

    function loadRoute(page, session, replace) {
      page = ALLOWED.includes(page) ? page : 'home';
      if (session) sessionStorage.setItem('tp_session_token', session);
      if (page === 'home') session = '';

      let target = page === 'home'
        ? SCRIPT_URL
        : SCRIPT_URL + '?page=' + encodeURIComponent(page);
      if (session && page === 'main') target += '&session=' + encodeURIComponent(session);

      frame.src = target;
      setBrowserRoute(page, session, replace);
    }

    window.addEventListener('message', function(event) {
      const validOrigin = event.origin === 'https://script.google.com' || event.origin === 'https://script.googleusercontent.com';
      if (!validOrigin) return;
      const data = event.data || {};
      if (data.type === 'TP_ROUTE') {
        const session = data.session || sessionStorage.getItem('tp_session_token') || '';
        loadRoute(data.page || 'home', session, false);
      }
    });

    window.addEventListener('popstate', function() {
      const route = readRoute();
      loadRoute(route.page, route.session, true);
    });

    const initial = readRoute();
    loadRoute(initial.page, initial.session, true);
  </script>
</body>
</html>
